<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 수정</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2 class="mb-4">상품 수정</h2>

<form th:action="@{/products/{id}/edit(id=${productId})}"
      th:object="${productDto}"
      method="post">

    <div class="mb-3">
        <label class="form-label">상품명</label>
        <input type="text" th:field="*{name}" class="form-control">

        <div class="text-danger"
             th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">가격</label>
        <input type="number" th:field="*{price}" class="form-control">

        <div class="text-danger"
             th:if="${#fields.hasErrors('price')}"
             th:errors="*{price}">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">설명</label>
        <textarea th:field="*{description}"
                  class="form-control"
                  rows="4"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">재고</label>
        <input type="number" th:field="*{stock}" class="form-control">

        <div class="text-danger"
             th:if="${#fields.hasErrors('stock')}"
             th:errors="*{stock}">
        </div>
    </div>

    <button type="submit" class="btn btn-primary">
        수정 완료
    </button>

    <a th:href="@{/products}" class="btn btn-secondary">
        목록
    </a>
</form>

<hr class="my-4">

<footer class="text-muted text-center">
    실습 수행:
    <span th:text="${#temporals.format(#temporals.createNow(),
    'yyyy-MM-dd HH:mm:ss')}"></span>
    │ 학번: 2271434 │ 성명: 김가현
</footer>

</body>
</html>
