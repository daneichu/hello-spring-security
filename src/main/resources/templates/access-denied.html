<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 거부</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-body text-center py-5">
            <h1 class="fw-bold text-danger mb-3">403</h1>
            <h4 class="fw-bold mb-3">접근 권한이 없습니다.</h4>
            <p class="text-muted mb-4">
                이 페이지는 관리자 권한이 있는 사용자만 접근할 수 있습니다.
            </p>

            <a th:href="@{/home}" class="btn btn-primary">홈으로 이동</a>
            <a th:href="@{/products}" class="btn btn-outline-secondary">상품 목록</a>
        </div>
    </div>

    <footer class="text-center mt-4 mb-4 text-muted small">
        실습 수행 일시 :
        <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span>
        │ 학번 : 2271434 │ 성명 : 김가현
    </footer>
</div>

</body>
</html>
