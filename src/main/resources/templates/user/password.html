<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h3 class="fw-bold mb-4">비밀번호 변경</h3>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/user/password}"
                  th:object="${passwordChangeDto}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">현재 비밀번호</label>
                    <input type="password" th:field="*{currentPassword}" class="form-control">
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('currentPassword')}"
                         th:errors="*{currentPassword}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">새 비밀번호</label>
                    <input type="password" th:field="*{newPassword}" class="form-control">
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">새 비밀번호 확인</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control">
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    비밀번호 변경
                </button>

                <a th:href="@{/home}" class="btn btn-outline-secondary w-100 mt-2">
                    홈으로 돌아가기
                </a>
            </form>
        </div>
    </div>

    <footer class="text-center mt-4 mb-4 text-muted small">
        실습 수행 일시 :
        <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span>
        │ 학번 : 2271434 │ 성명 : 김가현
    </footer>
</div>

</body>
</html>
